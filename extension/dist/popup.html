<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header><span class="brand">Backrow</span><span class="caret" aria-hidden="true"></span></header>
<main id="view" aria-live="polite"></main>
<section id="accountPage" class="you" hidden></section>
<section class="you">
  <span class="label">Your profile</span>
  <div class="photo-row">
    <span id="avatar" class="avatar"></span>
    <button id="photo" class="btn ghost small" type="button">Upload photo</button>
    <button id="removePhoto" class="btn ghost small" type="button" hidden>Remove</button>
    <input id="photoFile" type="file" accept="image/*" hidden>
  </div>
  <p id="photoError" class="error" hidden></p>
  <label class="label" for="name">Display name</label>
  <input id="name" class="field" maxlength="24" autocomplete="off">
  <span class="label">Color</span>
  <div id="swatches" class="swatches" role="group" aria-label="Your color"></div>
  <div id="accountRow" class="account-row"></div>
</section>
<footer><a id="home" target="_blank" rel="noopener">Stream your own video</a><a href="https://github.com/neelsatyavolu/backrow" target="_blank" rel="noopener">Source</a></footer>
<script src="popup.js"></script>
</body>
</html>
